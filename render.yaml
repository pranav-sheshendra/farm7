services:
  - type: web
    name: farm-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ASSISTANT_PROVIDER
        value: groq
      - key: ASSISTANT_MODEL
        value: qwen/qwen3.8-27b
      - key: GROQ_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: farm_ai
      - key: ADMIN_PASSWORD
        sync: false
