<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Farm AI</title><link rel="stylesheet" href="/static/app.css"></head>
<body><svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><symbol id="icon-leaf" viewBox="0 0 24 24"><path d="M20 4c-8-1-15 2-15 8a6 6 0 0 0 6 6c6 0 9-7 9-14Z"/><path d="M4 21 15 10"/></symbol><symbol id="icon-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5H4l-2 2V11.5a9.5 9.5 0 0 1 19 0Z"/><path d="M7 10h9M7 14h5"/></symbol><symbol id="icon-mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></symbol><symbol id="icon-send" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v15"/></symbol><symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="icon-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol><symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol><symbol id="icon-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></symbol><symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v5h16v-5"/></symbol><symbol id="icon-speaker" viewBox="0 0 24 24"><path d="m11 4-6 5H2v6h3l6 5V4ZM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/></symbol><symbol id="icon-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></symbol><symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2"/></symbol></svg><header><a class="brand" href="/"><svg class="icon" aria-hidden="true"><use href="#icon-leaf"></use></svg><span data-i18n="brand">Farm AI</span><span class="brand-dot"></span></a>
<nav role="tablist" aria-label="Farm AI"><button id="analysisTab" role="tab" aria-selected="true" aria-controls="analysisPanel"><svg class="icon" aria-hidden="true"><use href="#icon-leaf"></use></svg><span data-i18n="analysis">Crop analysis</span></button><button id="assistantTab" role="tab" aria-selected="false" aria-controls="assistantPanel"><svg class="icon" aria-hidden="true"><use href="#icon-chat"></use></svg><span data-i18n="assistant">Assistant</span></button></nav>
<div class="header-right"><svg class="icon" aria-hidden="true"><use href="#icon-globe"></use></svg><label class="sr-only" for="language" data-i18n="language">Language</label><select id="language"></select></div></header><main><section id="analysisPanel" role="tabpanel" aria-labelledby="analysisTab"><div class="eyebrow" data-i18n="eyebrow"></div><h1 data-i18n="heading"></h1><p class="intro" data-i18n="intro"></p>
<div class="grid"><section class="card"><h2 data-i18n="upload"></h2><form id="imageForm"><label class="upload"><input id="image" type="file" accept="image/jpeg,image/png,image/webp" required aria-label="Upload a leaf photo"><div id="uploadPrompt"><div class="upload-icon"><svg class="icon" aria-hidden="true"><use href="#icon-upload"></use></svg></div><strong data-i18n="choose"></strong><p data-i18n="formats"></p></div><img id="preview" alt="" hidden></label><p id="filename" class="small"></p><button class="primary" id="analyze" data-i18n="analyze" disabled></button></form><p id="imageError" role="alert" class="error"></p><p class="small" data-i18n="privacy"></p></section>
<section class="card" aria-live="polite"><h2 data-i18n="result"></h2><div id="empty" class="empty"><div class="upload-icon"><svg class="icon" aria-hidden="true"><use href="#icon-leaf"></use></svg></div><h3 data-i18n="empty"></h3><p data-i18n="emptyHelp"></p></div><div id="result" hidden><div id="crop" class="eyebrow"></div><h3 id="disease" class="disease"></h3><div class="score-heading"><span data-i18n="modelScore"></span><strong id="confidence"></strong></div><div class="bar"><div id="confidenceBar"></div></div><p id="uncertain" class="notice" data-i18n="uncertain" hidden></p><h4 data-i18n="alternatives"></h4><div id="alternatives"></div><button id="discuss" class="secondary" data-i18n="discuss"></button><p class="small" data-i18n="disclaimer"></p></div></section></div>
<p class="small" data-i18n="modelInfo"></p><details class="supported"><summary data-i18n="supported"></summary><p id="supportedCrops"></p></details></section>
<section id="assistantPanel" role="tabpanel" aria-labelledby="assistantTab" hidden>
<div class="chat-toolbar"><div class="connection-pill"><span class="status-dot"></span><span id="connection" data-i18n="connecting"></span><code id="modelName" hidden></code></div><button id="clearChat" class="quiet-button"><svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg><span data-i18n="clear"></span></button></div>
<div class="chat-layout"><section class="chat-card">
<div id="welcome" class="chat-welcome"><div class="hero-mark"><svg class="icon" aria-hidden="true"><use href="#icon-leaf"></use></svg><span class="orbit orbit-one"></span><span class="orbit orbit-two"></span></div><div class="eyebrow" data-i18n="tagline"></div><h1 data-i18n="chatTitle"></h1><p data-i18n="chatSubtitle"></p>
<div class="suggestions"><button type="button" data-prompt="promptDisease"><svg class="icon" aria-hidden="true"><use href="#icon-leaf"></use></svg><span data-i18n="suggestDisease"></span><span class="suggest-arrow">&#8599;</span></button><button type="button" data-prompt="promptCare"><svg class="icon" aria-hidden="true"><use href="#icon-sun"></use></svg><span data-i18n="suggestCare"></span><span class="suggest-arrow">&#8599;</span></button><button type="button" data-prompt="promptPlan"><svg class="icon" aria-hidden="true"><use href="#icon-chat"></use></svg><span data-i18n="suggestPlan"></span><span class="suggest-arrow">&#8599;</span></button></div></div>
<div id="messages" role="log" aria-live="polite"></div>
<div class="composer-wrap"><div id="voiceActivity" class="voice-activity" hidden><span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><span id="activityLabel" data-i18n="listeningShort"></span><button id="stopVoice" type="button" class="stop-button" hidden><svg class="icon" aria-hidden="true"><use href="#icon-stop"></use></svg><span data-i18n="stop"></span></button></div>
<form id="chatForm"><label class="sr-only" for="message" data-i18n="message"></label><textarea id="message" maxlength="6000" rows="2" data-placeholder="message"></textarea><div class="composer-actions"><div><button id="voice" type="button" class="voice-button" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#icon-mic"></use></svg><span data-i18n="voice"></span></button><button id="type" type="button" hidden data-i18n="type"></button><button id="voiceSettingsButton" type="button" class="icon-button" data-title="voiceOptions"><svg class="icon" aria-hidden="true"><use href="#icon-settings"></use></svg></button></div><button id="send" class="send-button" data-title="send"><svg class="icon" aria-hidden="true"><use href="#icon-send"></use></svg><span class="sr-only" data-i18n="send"></span></button></div></form>
<div class="composer-help"><span data-i18n="composerHint"></span><span class="private-note"><svg class="icon" aria-hidden="true"><use href="#icon-leaf"></use></svg><span data-i18n="localChat"></span></span></div><p id="chatError" role="alert" class="error"></p><p id="speechStatus" role="status" class="small"></p></div>
</section></div><dialog id="voiceDialog"><div class="dialog-heading"><h2 data-i18n="voiceOptions"></h2><button id="closeVoiceDialog" class="icon-button" type="button" data-title="close"><svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg></button></div><div class="voice-card"><label for="voices" data-i18n="voiceName"></label><select id="voices"></select><p id="voiceDetails" class="small"></p><p class="small" data-i18n="speechNotice"></p><details class="advanced-voice"><summary data-i18n="voiceSettings"></summary><label for="reference" data-i18n="reference"></label><textarea id="reference" rows="2" maxlength="2000"></textarea><button id="recordTest" class="secondary" data-i18n="testVoice"></button><label for="transcript" data-i18n="transcript"></label><textarea id="transcript" rows="2" maxlength="2000" readonly></textarea><button id="measure" class="secondary" data-i18n="measure"></button><div id="metrics" class="small" aria-live="polite"></div><p class="small" data-i18n="testHelp"></p><button id="export" class="secondary" data-i18n="export" disabled></button></details></div></dialog></section><p id="translationNotice" class="small"></p><p id="globalError" role="alert" class="error"></p></main><script id="languages" type="application/json">{{languages|tojson}}</script><script src="/static/app.js" defer></script></body></html>
